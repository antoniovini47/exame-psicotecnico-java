apply plugin: 'com.android.application'

def productionAds = project.findProperty('adsProduction') == 'true'
gradle.taskGraph.whenReady { graph ->
    if (!productionAds && graph.allTasks.any { it.name == 'bundleRelease' }) {
        throw new GradleException('bundleRelease publica na loja: rode com -PadsProduction=true para usar os anúncios reais')
    }
}

android {
    compileSdkVersion 34
    defaultConfig {
        resValue 'string', 'iddobanner', productionAds ? 'ca-app-pub-9218769381944425/9573093376' : 'ca-app-pub-3940256099942544/6300978111'
        resValue 'string', 'idinteresticial', productionAds ? 'ca-app-pub-9218769381944425/2459129925' : 'ca-app-pub-3940256099942544/1033173712'
        applicationId "com.rotech.examepsicotecnico"
        minSdk 21
        targetSdkVersion 34
        versionCode 10
        multiDexEnabled true
        versionName "1.9"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.rotech.examepsicotecnico'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.android.support:multidex:1.0.3'
    testImplementation 'junit:junit:4.13.2'
    //noinspection GradleCompatible
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
